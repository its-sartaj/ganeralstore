<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4430"/>
      <stop offset="100%" stop-color="#152A1C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#C68A2E"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#pineGrad)"/>
  <!-- Decorative border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#FFE082" stroke-width="10" stroke-opacity="0.3"/>
  
  <!-- Storefront Roof / Awning -->
  <path d="M 120 190 L 392 190 L 416 250 C 416 270, 396 280, 380 280 C 364 280, 352 270, 344 260 C 336 270, 324 280, 308 280 C 292 280, 280 270, 272 260 C 264 270, 252 280, 236 280 C 220 280, 208 270, 200 260 C 192 270, 180 280, 164 280 C 148 280, 128 270, 128 250 Z" fill="#F1EAD9" stroke="#241F18" stroke-width="8"/>
  <!-- Awning Stripes -->
  <path d="M 164 190 L 164 280 M 200 190 L 200 260 M 236 190 L 236 280 M 272 190 L 272 260 M 308 190 L 308 280 M 344 190 L 344 260 M 380 190 L 380 280" stroke="#B14B2C" stroke-width="14" stroke-linecap="round"/>

  <!-- Store Body -->
  <rect x="144" y="276" width="224" height="136" rx="8" fill="#F1EAD9" stroke="#241F18" stroke-width="8"/>

  <!-- Store Door -->
  <rect x="220" y="324" width="72" height="88" rx="4" fill="#2B4430"/>
  <!-- Door knob -->
  <circle cx="232" cy="368" r="5" fill="#FFE082"/>

  <!-- Store Windows -->
  <rect x="160" y="324" width="44" height="48" rx="4" fill="#FFE082" fill-opacity="0.85" stroke="#241F18" stroke-width="4"/>
  <rect x="308" y="324" width="44" height="48" rx="4" fill="#FFE082" fill-opacity="0.85" stroke="#241F18" stroke-width="4"/>

  <!-- Top Emblem / Letter K -->
  <circle cx="256" cy="132" r="42" fill="url(#goldGrad)"/>
  <text x="256" y="148" font-family="'Space Grotesk', system-ui, sans-serif" font-size="46" font-weight="900" fill="#152A1C" text-anchor="middle">K</text>
</svg>
